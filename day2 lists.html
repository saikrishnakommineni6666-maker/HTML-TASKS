<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Ordered Lists</h2>
    <ol type="1">
        <li>apple</li>
        <li>banana</li>
        <li>cranberry</li>
        <li>dragon fruit</li>
        <li>edamame</li>
    </ol>
    <h2>unordered lists</h2>
    <ul type="circle" >
    
        <li>apple</li>
        <li>banana</li>
        <li>cranberry</li>
        <li>dragon fruit</li>
        <li>edamame</li>
    </ul>
    <h2>descriptive lists</h2><!-- first write dl next followed by dt and dd/-->
    <dl>
        <dt>HTML</dt>
        <dd>hyper text markup language</dd>
        <dt>CSS</dt>
        <dd>cascade stylesheet</dd>
    </dl>
</body>
</html>
