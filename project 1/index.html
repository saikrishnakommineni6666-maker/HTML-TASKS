<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <h1 align="center">Registration form</h1>
    
    <form action="./login.html" method="">
    <div>
        <label for="">NAME</label>
         <input type="text" placeholder="Enter the name"  name="names"  id="name"/>
    </div><br>

    <div>
        <label for="">EMAIL</label>
        <input type="email"  placeholder="enter the mail"  name="mail"  id="email" />

    </div><br>
    
    <div>
        <label for="">PASSWORD</label>
        <input type="password"  placeholder="enter the password"  name="pass"  id="pword" />

    </div><br>

    <div>
        <label for="">CONFIRM PASSSWORD</label>
        <input type="password"  placeholder="Re-enter the password"  name="epass"  id="epword" />

    </div><br>

    <div>
        <label for="">PHNO:</label>
        <input type="number"  placeholder="enter the ph no"  name="num"  id="pnum" />

    </div><br>

    <div>
        <label for="">ADDRESS</label><br>
        <textarea col="14" row="14" placeholder="Enter the address"></textarea>
    </div><br>


    <div>
        <label for="">select gender</label><br>
        <input type="radio" id="gmale" name="gn"/>
        <label for ="gmale">MALE</label>
        <input type="radio" id="fmale" name="gn"/>
        <label for ="fmale">FEMALE</label>
    </div><br>
    
    <div>
        
        <input type="file" name="files" id="files" />
    </div><br><br>


    <div>
        <button>Submit</button>
        <a href="./login.html" target="_blank">If ACC already exist</a>
    </div>

</form><br>
<footer>
    <a href="https://codegnan.com"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNRHlgEyq3R3DZ7JhtDxg3i5cvXG4-SdwxMquFg5ogyg&s=10"  alt="imag" width="5%" /></a>
</footer>
</center>

</body>
</html>
