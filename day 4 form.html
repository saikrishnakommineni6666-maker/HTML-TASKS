<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" method="">
        <div>
            <label for="">Name</label>
            <input type="text" placeholder="enter fullname" name="name" id="text1" required />
        </div>
        <div>
            <label for="">EMail</label>
            <input type="email" placeholder="enter email" name="email" id="emailid" required />
        </div>

        <div>
            <label for="">Password</label>
            <input type="password" palceholder="password" name="pass" id="pword" required />
        </div>

        <div>
            <input type="radio" id="gmale"
                name="gender" /><!-- giving NAME attribute here in radio gives option to select only one when you click so we should give same value for the NAME attribute-->
            <label
                for="gmale">male</label><!-- suppose when we want to select radio when we click on text for that we shuld establish connection with id in input tag and for attribute inside label tag ID values should be unique -->
            <input type="radio" id="fmale" name="gender" />
            <label for="fmale">female</label>
        </div>


        <div>

            <input type="checkbox" id="check1" />
            <label for="check1">10th</label>
            <input type="checkbox" id="check2" />
            <label for="check2">Inter</label>
            <input type="checkbox" id="check3" />
            <label for="check3">B.TECH</label>
        </div>

        <div>
            <select name="city" id="options">
                <option value="">select your city</option>
                <option value="vijayawada">vijayawada</option>
                <option value="guntur">Guntur</option>
                <option value="hyderabad">Hyderabad</option>


            </select>
        </div>


        <div>
            <textarea rows="5" cols="20" placeholder="enter the address"></textarea>


        </div>

        <div>
            <input type="date"/>
        </div>
        <div>
            <input type="file"/>
        </div>
        <button>submit</button>

    </form>

</body>

</html>
